[project]
name = "screw-oilcheck-vision"
version = "0.1.0"
description = "丝杆取料与人工二次涂油视觉检测系统（第一阶段框架）"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.10",
    "pillow>=10.0",
    "pyside6>=6.10.3,<6.11",
    "pyside6-fluent-widgets[full]>=1.10.5,<1.11",
    "torch>=2.7",
    "torchvision>=0.26.0",
    "ultralytics>=8.4.202",
]

[dependency-groups]
dev = [
    "black>=24.0",
    "pytest>=8.0",
    "ruff>=0.6",
]

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

# 部署目标为 GPU 服务器：torch/torchvision 走 CUDA 12.8 索引。
# 无显卡的纯开发机见 docs/09-开发环境与运行.md「无 GPU 的本地环境」，
# 用 uv.toml 本地覆盖，不要改动本文件与 uv.lock。
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = ["legacy", "lib", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP042"]

[tool.black]
line-length = 88
target-version = ["py311"]
